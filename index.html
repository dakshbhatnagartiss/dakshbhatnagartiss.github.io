<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suprise</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Initial trigger button */
    #trigger-btn {
      padding: 16px 36px;
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
      background-color: #111;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    #trigger-btn:hover {
      background-color: #333;
      transform: scale(1.04);
    }

    #trigger-btn:active {
      transform: scale(0.97);
    }

    /* Emoji container, hidden by default */
    main {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 100%;
      white-space: nowrap;
      font-family: system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
      font-size: clamp(5rem, 32vw, 35rem);
      line-height: 1;
      user-select: none;
    }
  </style>
</head>
<body>
  <button id="trigger-btn">Click Me</button>

  <main id="emoji-container" aria-label="You pointing and laughing">🫵🤣</main>
  
  <audio id="laugh-audio" src="laugh.wav" preload="auto"></audio>

  <script>
    const btn = document.getElementById('trigger-btn');
    const container = document.getElementById('emoji-container');
    const audio = document.getElementById('laugh-audio');

    btn.addEventListener('click', () => {
      // Hide button and display emojis
      btn.style.display = 'none';
      container.style.display = 'flex';

      // Play sound
      audio.play().catch(err => {
        console.error('Playback failed:', err);
      });
    });
  </script>
</body>
</html>
